# revali project configuration. Copy to the repo root as revali.toml.
#
# Three layers, most specific wins:
#   <revali>/defaults.toml  <  ~/.revali/config.toml  <  this file
# Every key below is optional; leave a key out (or delete it) to inherit the
# user or tool default. defaults.toml lists every key with its default.
# Commands run through the platform shell from the repo root (or from the
# sandbox clone for the [validate.*] tables).

[project]
config_version = 1
base_branch = "main"              # empty = the repo's default branch (via gh)
platforms = ["linux"]             # v1.0 supports linux only
lint = ""                         # e.g. "ruff check . && black --check ."; failure blocks review
test_dir = "tests"
test_file_pattern = "test_review_{topic}.py"
test_guide = ""                   # optional doc telling the reviewer how tests are added

[review]
engine = "claude"                 # which CLI runs the reviewer; see [engines.*] in defaults.toml
model = "auto"                    # auto = one tier above the Developer's model (change.md author_model)
fallback_model = "auto"           # auto = the tiers below the chosen one, strongest first
effort = "high"
max_fixes = 2                     # fix cycles the author may make before a human is asked
max_diff_lines = 800
budget_usd = 2.0
checklist = "CONVENTIONS.md"      # project layer; built-in and user layers are prepended
# prompt = "docs/review-prompt.md"       # replace the built-in reviewer prompt (same $placeholders)
# schema = "docs/review.schema.json"     # replace the built-in answer schema
timeout_min = 20
exclude = ["*.lock", "dist/**", "vendor/**"]

[validate]
engine = "claude"                 # which CLI runs the diagnosis session on FAIL
model = "auto"                    # auto = one tier below the Developer's model
fallback_model = "auto"
budget_usd = 1.0

[validate.linux]
runner = "wsl"                    # wsl | local | ssh
distro = "Ubuntu"                 # wsl only
# host = "user@box"               # ssh only; port and key come from ~/.ssh/config
# connect_timeout_s = 15          # ssh only; default from defaults.toml
# transfer_timeout_min = 10       # ssh only; one scp transfer
command_timeout_min = 15
# sandbox_dir = "~/.revali/sandbox"      # inside the distro; default from defaults.toml
setup = "python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt"
build = ""
test = ".venv/bin/python -m pytest -q"            # existing suite; may be empty
new_test = ".venv/bin/python -m pytest -q tests"  # required: how to run test_dir

[merge]
method = "squash"
wait_for_checks = true
checks_timeout_min = 30
