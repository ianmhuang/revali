# revali reviewing itself (dogfood). Keys left out come from defaults.toml.

[project]
config_version = 1
base_branch = "main"
platforms = ["linux"]
test_dir = "tests"
test_file_pattern = "test_review_{topic}.py"

[review]
budget_usd = 8.0                  # a 700-line refactor took 26 turns and more than 4.0
checklist = "CONVENTIONS.md"
exclude = []
max_diff_lines = 1000             # the ssh-runner PR reached 855 after its round-1 fixes

[validate]
budget_usd = 1.0

[validate.linux]
runner = "wsl"
distro = "Ubuntu"
# The suite builds a git repo per test; about 9 minutes on the Windows host,
# not yet measured in WSL.
command_timeout_min = 30
test = "python3 -m unittest discover -s tests -t ."
new_test = "python3 -m unittest discover -s tests -t . -p 'test_review_*.py'"

[merge]
method = "squash"
