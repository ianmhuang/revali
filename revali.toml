# revali reviewing itself (dogfood). Keys left out come from defaults.toml.

[project]
config_version = 1
base_branch = "main"
lint = "ruff check . && black --check ."   # settings in pyproject.toml; preflight stops with exit 2 on a failure
platforms = ["linux"]
test_dir = "tests"
test_file_pattern = "test_review_{topic}.py"

[review]
budget_usd = 8.0                  # a 700-line refactor took 26 turns and more than 4.0
checklist = "CONVENTIONS.md"
exclude = []
max_diff_lines = 1200             # the ssh-runner PR reached 855 after its round-1 fixes;
                                  # the README -> docs/ split was 1097, ~620 of them a verbatim move

[validate]
budget_usd = 1.0

[validate.linux]
runner = "wsl"
distro = "Ubuntu"
# The suite builds a git repo per test: 7-8 minutes for ~950 tests in the WSL
# sandbox (2026-09-05), far longer on the Windows host.
command_timeout_min = 30
test = "python3 -m unittest discover -s tests -t ."
# {files} = the reviewer's test files (this round's in the smoke run, the branch's in
# validation), so only the new tests run here, not every test_review_*.py ever landed.
new_test = "python3 -m unittest {files}"

[merge]
method = "squash"
