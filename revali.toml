# revali reviewing itself (dogfood). See templates/revali.toml for every key.

[project]
config_version = 1
base_branch = "main"
platforms = ["linux"]
lint = ""
test_dir = "tests"
test_file_pattern = "test_review_{topic}.py"

[review]
model = "fable"
fallback_model = "opus,sonnet"
effort = "high"
max_fixes = 2
max_diff_lines = 800
budget_usd = 2.0
checklist = "CONVENTIONS.md"
timeout_min = 20
exclude = []

[validate]
model = "opus"
fallback_model = "sonnet"
effort = "high"
budget_usd = 1.0

[validate.linux]
runner = "wsl"
distro = "Ubuntu"
# The suite builds a git repo per test; about 9 minutes on the Windows host,
# not yet measured in WSL.
command_timeout_min = 30
setup = ""
build = ""
test = "python3 -m unittest discover -s tests -t ."
new_test = "python3 -m unittest discover -s tests -t . -p 'test_review_*.py'"

[merge]
method = "squash"
wait_for_checks = true
checks_timeout_min = 30
