# revali reviewing itself (dogfood). Keys left out come from defaults.toml.

[project]
config_version = 1
base_branch = "main"
lint = "ruff check . && black --check ."   # settings in pyproject.toml; preflight stops with exit 2 on a failure
format = "black {files}"                     # the reviewer's test files that differ from HEAD, before the lint line
platforms = ["linux"]
test_dir = "tests"
test_file_pattern = "test_review_{topic}.py"

[review]
budget_usd = 8.0                  # a 700-line refactor took 26 turns and more than 4.0
checklist = "CONVENTIONS.md"
exclude = ["bench/cases/*/change.md", "tests/durations.json"]
# bench/cases/*/change.md: a past round's description, cut verbatim from the archived prompt
# by tools/bench_case.py. tests/durations.json: measured seconds per test class, written by
# `tests/run_parallel.py --durations-out` (one line per class, 1100+ lines)
max_diff_lines = 1500             # the ssh-runner PR reached 855 after its round-1 fixes;
                                  # the README -> docs/ split was 1097, ~620 of them a verbatim move;
                                  # the review benchmark was 1413 after its round-1 fixes, ~300 of
                                  # them case data

[validate]
budget_usd = 1.0

[validate.linux]
runner = "wsl"
distro = "Ubuntu"
# The suite gives every test its own git repo (since fixture-copy, a copy of one built
# once per worker for each kind): 7-8 minutes serially for ~1000 tests in
# the WSL sandbox (2026-09-05), far longer on the Windows host; run_parallel.py
# shards it by test class over the CPUs and prints one unittest-style summary.
command_timeout_min = 30
test = "python3 tests/run_parallel.py"
# {files} = the reviewer's test files (this round's in the smoke run, the branch's in
# validation), so only the new tests run here, not every test_review_*.py ever landed.
new_test = "python3 -m unittest {files}"

[merge]
method = "squash"
# The Windows CI leg (job time) took 28, 37 and 44 minutes on the same runner image
# (2026-11-11), as one job. ci-windows-shards (PR #74) split it into four jobs by test
# count. On 2026-11-20 their test times were 779 s (EPYC 9V74), 917 s (EPYC 9V74), 719 s
# (EPYC 9V45) and 1320 s (EPYC 7763), and the slowest job took 22.2 minutes (run
# 44661036941). Runner CPUs differ per job: the 7763 is 25-45% slower than the others.
# Since ci-shard-time it runs as six jobs balanced by tests/durations.json: 469 s (EPYC
# 9V45), 787 s (EPYC 7763), 764 s (EPYC 7763), 486 s (EPYC 9V45), 779 s (EPYC 7763) and
# 548 s (Xeon 6973P), and the slowest job took 13.4 minutes (run 44671669777). Since
# fixture-copy a test copies its fixture repo instead of building it: 548 s (Xeon 8573C),
# 429 s (EPYC 9V74), 502 s (EPYC 9V74), 597 s (EPYC 7763), 592 s (EPYC 7763) and 601 s
# (EPYC 7763), and the slowest job took 10.3 minutes (run 44681575353), so merge waits
# about 11. Since macos-ci macOS runs beside them as two jobs: 314 s (Apple M2 Pro, 5
# processors) and 611 s (Apple M1, 3 processors); its slowest job took 10.5 minutes and the
# slowest Windows job 10.7 (run 44694774736), so merge still waits about 11. Its merge run
# put both on an Apple M1: 736 s and 682 s, a 12.5-minute job against 10.8 for Windows (run
# 44699291834). Since macos-three-shards macOS runs as three jobs: 639 s, 380 s and 585 s,
# all on an M1 (the shards are balanced by the class seconds recorded on the Windows host,
# tests/durations.json, not the Mac's); the slowest macOS job took 11.1 minutes, the slowest Windows job 10.4 and the Ubuntu lint job,
# unsharded on an EPYC 7763, 13.4 (run 44703309818). Which leg is slowest depends on the
# runners, so merge waits about 11 to 14 minutes. The docs and the workflow point here
# instead of repeating the figures.
# Keep this above the job's timeout-minutes in .github/workflows/test.yml, so a hung leg is
# cancelled and reported as failed before merge stops waiting.
checks_timeout_min = 75
